name: Firebase backend preview checks
on:
  workflow_dispatch:
  push:
    branches: [jsox-preview]
    paths:
      - 'cloud/**'
      - '.github/workflows/firebase-backend-checks.yml'
permissions:
  contents: read
jobs:
  functions-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
        working-directory: cloud/functions
      - run: npm test
        working-directory: cloud/functions
      - name: Local-only Firestore and Storage Rules tests
        run: npm run test:emulators
        working-directory: cloud/functions
  cpu-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud/worker/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r cloud/worker/requirements.lock
      - name: Real CPU media and fake-transport job-state tests
        run: python -m unittest discover -s cloud/worker/tests -v
        env:
          PYTHONPATH: cloud/worker
